pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        // Warn if engine artifacts are missing (helps debugging missing io.flutter/* artifacts)
        def engineArtifactsDir = file(flutterSdkPath + "/bin/cache/artifacts/engine/android")
        if (!engineArtifactsDir.exists()) {
            println "WARNING: Flutter engine artifacts not found at: ${engineArtifactsDir}. Run `flutter precache` or delete SDK 'bin/cache' and run `flutter doctor` to re-download artifacts."
        }
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        // try local cache first, then primary repositories, plus an alternate mirror
        mavenLocal()
        google()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url "https://repo1.maven.org/maven2/" }
        maven { url "https://maven.aliyun.com/repository/public" }
        maven { url "https://storage.googleapis.com/download.flutter.io" }
        // Add Flutter engine artifacts (local SDK cache) to resolve io.flutter/* debug artifacts
        maven { url uri("$flutterSdkPath/bin/cache/artifacts/engine/android") }
        gradlePluginPortal()
    }
    
    // Force Kotlin plugin to a reachable module/version if a dependency requests a later one that fails
    resolutionStrategy {
        eachPlugin {
            def pluginId = requested.id.id
            if (pluginId.startsWith("org.jetbrains.kotlin")) {
                useModule("org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20")
            }
        }
    }

    plugins {
        id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.9.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"

// Ensure all project dependencies can resolve from these repositories (use local/mirror as fallback)
dependencyResolutionManagement {
    // Allow plugins and build scripts to add repositories but prefer the settings repositories
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        mavenLocal()
        google()
        mavenCentral()
        maven { url "https://storage.googleapis.com/download.flutter.io" }
        // Add Flutter engine artifacts (local SDK cache) to resolve io.flutter/* debug artifacts
        def _props = new Properties()
        file("local.properties").withInputStream { _props.load(it) }
        def _flutterSdk = _props.getProperty('flutter.sdk')
        if (_flutterSdk != null) {
            // Use a file URI to ensure Gradle resolves the local Flutter engine artifacts correctly
            maven { url uri(_flutterSdk + "/bin/cache/artifacts/engine/android") }
        }
        maven { url "https://maven.aliyun.com/repository/public" }
    }
}

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def requiredSigningKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def missingSigningKeys = requiredSigningKeys.findAll {
    !keystoreProperties[it] || keystoreProperties[it].toString().trim().isEmpty()
}
def releaseKeystoreFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
def hasReleaseSigningConfig = keystorePropertiesFile.exists() && missingSigningKeys.isEmpty() && releaseKeystoreFile != null && releaseKeystoreFile.exists()

android {
    namespace "com.dossy.chatia"
    compileSdk 36
    
    ndkVersion flutter.ndkVersion

    compileOptions {
        // Use Java 17 per modern AGP requirements and enable desugaring
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.dossy.chatia"
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (hasReleaseSigningConfig) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile releaseKeystoreFile
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (!hasReleaseSigningConfig) {
                def reason = []
                if (!keystorePropertiesFile.exists()) {
                    reason << "android/key.properties introuvable"
                }
                if (!missingSigningKeys.isEmpty()) {
                    reason << "cles manquantes: ${missingSigningKeys.join(', ')}"
                }
                if (releaseKeystoreFile == null || !releaseKeystoreFile.exists()) {
                    reason << "keystore introuvable: ${keystoreProperties['storeFile'] ?: 'non defini'}"
                }
                throw new Exception("Configuration release incomplete. ${reason.join(' | ')}")
            }
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.20"
    // Core library desugaring for Java 8+ API usage in dependencies
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}

// Apply Google Services plugin to process `google-services.json` and generate resources
apply plugin: 'com.google.gms.google-services'

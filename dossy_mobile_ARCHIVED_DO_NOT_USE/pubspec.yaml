name: dossy_mobile
description: Dossy - Legal & Tax Document Management App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.18.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.2
  get: ^4.6.5
  google_fonts: ^4.0.1
  flutter_screenutil: ^5.8.0
  
  # State Management
  provider: ^6.0.0
  
  # HTTP & API
  http: ^1.0.0
  dio: ^5.0.0
  
  # Local Storage
  shared_preferences: ^2.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Authentication
  flutter_secure_storage: ^8.0.0
  
  # File & Storage
  file_picker: ^5.2.0
  permission_handler: ^11.4.3
  document_file_save_plus: ^0.2.4
  
  # PDF Viewing
  syncfusion_flutter_pdfviewer: ^20.4.48
  
  # Analytics & Crash Reporting
  firebase_core: ^2.11.0
  firebase_analytics: ^10.1.0
  firebase_crashlytics: ^3.0.0
  
  # Notifications
  firebase_messaging: ^14.3.0
  
  # In-App Review (Play Store rating)
  in_app_review: ^2.0.8
  
  # Other utilities
  intl: ^0.18.0
  url_launcher: ^6.1.10
  connectivity_plus: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.3.3

flutter:
  uses-material-design: true
